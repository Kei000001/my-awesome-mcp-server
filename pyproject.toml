[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project]
name = "my-awesome-mcp-server"
version = "0.1.0"
description = "電卓・SQLiteデータベース分析・天気/ニュース/IP情報・Web検索とPython実行を提供するMCPサーバー集"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastmcp>=4.0.10",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
my-awesome-mcp-server = "mcp_learning:main"

[tool.uv.build-backend]
module-name = "mcp_learning"
